<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/icon.png">
    <title>CodeWiki Documentation Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.9.0/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js"></script>
    <style>
        :root {
            --primary-color: #d95f00;
            --secondary-color: #f2f5f8;
            --text-color: #26384f;
            --border-color: #dce3ea;
            --hover-color: #fff5eb;
            --code-bg: #f7f9fb;
            --navy: #071526;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: #ffffff;
        }
        
        .container {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 320px;
            background-color: var(--secondary-color);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            box-shadow: 6px 0 24px rgba(7, 21, 38, .04);
        }

        .brand {
            display: block;
            width: 180px;
            height: 56px;
            margin: -4px 0 12px;
        }

        .brand img { width: 100%; height: 100%; object-fit: contain; }
        
        .content {
            flex: 1;
            margin-left: 320px;
            padding: 40px 60px;
            max-width: calc(100% - 320px);
        }
        
        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #132b47;
            margin-bottom: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 2px;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: white;
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        
        .back-btn:hover {
            background: var(--hover-color);
            border-color: var(--primary-color);
        }
        
        .repo-info {
            margin: 20px 0;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        
        .repo-info h4 {
            margin: 0 0 10px 0;
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .info-row {
            font-size: 11px;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 4px;
        }
        
        .info-row strong {
            font-weight: 600;
            min-width: 80px;
            display: inline-block;
        }
        
        .repo-links {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .repo-link-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: white;
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
        }
        
        .repo-link-btn:hover {
            background: var(--hover-color);
            border-color: var(--primary-color);
            transform: translateX(2px);
        }
        
        .repo-link-btn svg {
            flex-shrink: 0;
        }
        
        .nav-section {
            margin-bottom: 20px;
        }
        
        .nav-section h3 {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            padding: 8px 12px;
        }
        
        .nav-item {
            display: block;
            padding: 10px 12px;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
            margin-bottom: 2px;
            cursor: pointer;
        }
        
        .nav-item:hover {
            background-color: white;
            color: var(--primary-color);
        }
        
        .nav-item.active {
            background-color: #102e50;
            color: white;
        }
        
        .nav-subsection {
            margin-left: 15px;
            margin-top: 5px;
        }
        
        .nav-subsection .nav-item {
            font-size: 13px;
            padding: 8px 12px;
        }
        
        .nav-subsection .nav-subsection {
            margin-left: 20px;
        }
        
        .nav-subsection .nav-subsection .nav-item {
            font-size: 12px;
            padding: 6px 10px;
        }
        
        .markdown-content {
            max-width: 100%;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .markdown-content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        
        .markdown-content h2 {
            font-size: 2rem;
            font-weight: 600;
            color: #334155;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        
        .markdown-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #475569;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }
        
        .markdown-content h4 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #475569;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        .markdown-content p {
            margin-bottom: 1rem;
            color: #475569;
        }
        
        .markdown-content ul, .markdown-content ol {
            margin-bottom: 1rem;
            padding-left: 2rem;
        }
        
        .markdown-content li {
            margin-bottom: 0.5rem;
            color: #475569;
        }
        
        .markdown-content code {
            background-color: var(--code-bg);
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            color: #e11d48;
        }
        
        .markdown-content pre {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.25rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
            color: var(--text-color);
            font-size: 0.875rem;
        }
        
        .markdown-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: #64748b;
            background: var(--hover-color);
            padding: 1rem 1rem 1rem 1.5rem;
            border-radius: 0 0.5rem 0.5rem 0;
        }
        
        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        
        .markdown-content th, .markdown-content td {
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            text-align: left;
        }
        
        .markdown-content th {
            background-color: var(--secondary-color);
            font-weight: 600;
            color: var(--text-color);
        }
        
        .markdown-content tr:hover {
            background-color: var(--hover-color);
        }
        
        .markdown-content a {
            color: var(--primary-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        
        .markdown-content a:hover {
            border-bottom-color: var(--primary-color);
        }
        
        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }
        
        .mermaid {
            position: relative;
            margin: 2rem 0;
            padding: 1.5rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            overflow-x: auto;
        }

        .mermaid svg {
            max-width: 100%;
            height: auto;
        }

        .mermaid.zoomable svg {
            cursor: zoom-in;
        }

        .mermaid-expand {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1;
            color: #64748b;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease, border-color 0.15s ease;
        }

        .mermaid:hover .mermaid-expand,
        .mermaid-expand:focus {
            opacity: 1;
        }

        @media (hover: none) {
            .mermaid-expand {
                opacity: 1;
            }
        }

        .mermaid-expand:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .mermaid-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 400;
            background: rgba(255, 255, 255, 0.98);
        }

        .mermaid-lightbox.open {
            display: block;
        }

        .lightbox-canvas {
            position: absolute;
            inset: 0;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }

        .lightbox-canvas.dragging {
            cursor: grabbing;
        }

        .lightbox-stage {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }

        .lightbox-toolbar {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 2;
            display: flex;
            gap: 8px;
        }

        .lightbox-toolbar button {
            min-width: 38px;
            height: 38px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-color);
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .lightbox-toolbar button:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .lightbox-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            padding: 6px 14px;
            font-size: 12px;
            color: #64748b;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            pointer-events: none;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: #64748b;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--secondary-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            padding: 2rem;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 0.5rem;
            color: #991b1b;
            margin: 2rem 0;
        }
        
        .error h3 {
            margin-bottom: 0.5rem;
        }
        
        @media (max-width: 1024px) {
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            
            .content {
                margin-left: 0;
                padding: 20px;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <a class="brand" href="index.html" aria-label="CodeWiki gallery">
                <img src="img/white-background-logo.png" alt="CodeWiki">
            </a>
            <a href="index.html" class="back-btn">← Back to Gallery</a>
            <div class="logo" id="repo-name">Loading...</div>
            
            <div class="repo-links" id="repo-links" style="display: none;"></div>
            
            <div class="repo-info" id="repo-info" style="display: none;">
                <h4>Generation Info</h4>
                <div id="info-content"></div>
            </div>
            
            <div class="nav-section">
                <div class="nav-item active" data-file="overview.md">
                    📄 Overview
                </div>
            </div>
            
            <div id="navigation"></div>
        </nav>
        
        <main class="content">
            <div id="loading" class="loading">
                <div class="loading-spinner"></div>
                <p>Loading documentation...</p>
            </div>
            
            <div id="content" class="markdown-content" style="display: none;"></div>
        </main>
    </div>
    
    <script>
        // Initialize marked with options
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false
        });
        
        // Initialize mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            themeVariables: {
                primaryColor: '#2563eb',
                primaryTextColor: '#334155',
                primaryBorderColor: '#e2e8f0',
                lineColor: '#64748b',
                secondaryColor: '#f1f5f9',
                tertiaryColor: '#f8fafc'
            },
            flowchart: { htmlLabels: true, curve: 'basis' },
            sequence: { mirrorActors: true, useMaxWidth: true }
        });
        
        let currentProject = '';
        let moduleTree = null;
        let metadata = null;
        let repoOwner = '';
        let repoName = '';
        
        // Get project from URL
        const urlParams = new URLSearchParams(window.location.search);
        currentProject = urlParams.get('project');
        
        if (!currentProject) {
            showError('No project specified in URL');
        } else {
            loadProject();
        }
        
        function parseProjectFolder(folderName) {
            // Remove -docs suffix
            let cleanName = folderName.replace(/-docs$/, '');
            
            // Split by --
            const parts = cleanName.split('--');
            
            if (parts.length === 2) {
                return {
                    owner: parts[0],
                    repo: parts[1],
                    githubUrl: `https://github.com/${parts[0]}/${parts[1]}`,
                    deepwikiUrl: `https://deepwiki.com/${parts[0]}/${parts[1]}`
                };
            }
            
            return {
                owner: 'Unknown',
                repo: cleanName,
                githubUrl: null,
                deepwikiUrl: null
            };
        }
        
        async function loadProject() {
            try {
                // Parse project info
                const projectInfo = parseProjectFolder(currentProject);
                repoOwner = projectInfo.owner;
                repoName = projectInfo.repo;
                
                // Load metadata
                const metadataResponse = await fetch(`docs/${currentProject}/metadata.json`);
                if (metadataResponse.ok) {
                    metadata = await metadataResponse.json();
                    displayMetadata();
                }
                
                // Load module tree
                const treeResponse = await fetch(`docs/${currentProject}/module_tree.json`);
                if (treeResponse.ok) {
                    moduleTree = await treeResponse.json();
                    buildNavigation();
                }
                
                // Set project name
                const displayName = currentProject.replace(/-docs$/, '').replace(/--/g, '/');
                document.getElementById('repo-name').textContent = displayName;
                document.title = `${displayName} - Documentation`;
                
                // Display repository links
                displayRepoLinks(projectInfo);
                
                // Load overview by default
                loadDocument('overview.md');
                
            } catch (error) {
                console.error('Error loading project:', error);
                showError('Failed to load project: ' + error.message);
            }
        }
        
        function displayRepoLinks(projectInfo) {
            const linksContainer = document.getElementById('repo-links');
            
            if (!projectInfo.githubUrl && !projectInfo.deepwikiUrl) {
                return;
            }
            
            let html = '';
            
            if (projectInfo.githubUrl) {
                html += `
                    <a href="${projectInfo.githubUrl}" class="repo-link-btn" target="_blank" rel="noopener noreferrer">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                        </svg>
                        Original GitHub Repository
                    </a>
                `;
            }
            
            if (projectInfo.deepwikiUrl) {
                html += `
                    <a href="${projectInfo.deepwikiUrl}" class="repo-link-btn" target="_blank" rel="noopener noreferrer">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M3 2.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5zM3 7a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 3 7zm0 4.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/>
                            <path fill-rule="evenodd" d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2zm15 0a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2z"/>
                        </svg>
                        Corresponding DeepWiki Docs
                    </a>
                `;
            }
            
            linksContainer.innerHTML = html;
            linksContainer.style.display = 'flex';
        }
        
        function displayMetadata() {
            if (!metadata || !metadata.generation_info) return;
            
            const info = metadata.generation_info;
            const stats = metadata.statistics || {};
            
            let html = '';
            if (info.main_model) {
                html += `<div class="info-row"><strong>Model:</strong> ${info.main_model}</div>`;
            }
            if (info.timestamp) {
                const date = new Date(info.timestamp);
                html += `<div class="info-row"><strong>Generated:</strong> ${date.toLocaleDateString()}</div>`;
            }
            if (info.commit_id) {
                html += `<div class="info-row"><strong>Commit:</strong> ${info.commit_id.substring(0, 8)}</div>`;
            }
            if (stats.total_components) {
                html += `<div class="info-row"><strong>Components:</strong> ${stats.total_components.toLocaleString()}</div>`;
            }
            if (stats.max_depth) {
                html += `<div class="info-row"><strong>Max Depth:</strong> ${stats.max_depth}</div>`;
            }
            
            document.getElementById('info-content').innerHTML = html;
            document.getElementById('repo-info').style.display = 'block';
        }
        
        function buildNavigation() {
            if (!moduleTree) return;
            
            const nav = document.getElementById('navigation');
            let html = '';
            
            for (const [key, data] of Object.entries(moduleTree)) {
                html += buildNavItem(key, data, 0);
            }
            
            nav.innerHTML = html;
            
            // Add click handlers
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const file = this.getAttribute('data-file');
                    if (file) {
                        loadDocument(file);
                        
                        // Update active state
                        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                        this.classList.add('active');
                    }
                });
            });
        }
        
        function buildNavItem(key, data, depth) {
            const indentClass = depth > 0 ? 'nav-subsection' : 'nav-section';
            const fileName = `${key}.md`;
            
            let html = `<div class="${indentClass}">`;
            
            if (data.components && data.components.length > 0) {
                html += `<div class="nav-item" data-file="${fileName}">
                    ${formatNavTitle(key)}
                </div>`;
            } else if (depth === 0) {
                html += `<h3>${formatNavTitle(key)}</h3>`;
            } else {
                html += `<div class="nav-item" data-file="${fileName}">
                    ${formatNavTitle(key)}
                </div>`;
            }
            
            if (data.children) {
                for (const [childKey, childData] of Object.entries(data.children)) {
                    html += buildNavItem(childKey, childData, depth + 1);
                }
            }
            
            html += '</div>';
            return html;
        }
        
        function formatNavTitle(key) {
            return key
                .replace(/_/g, ' ')
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }
        
        async function loadDocument(filename) {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            
            loading.style.display = 'flex';
            content.style.display = 'none';
            
            try {
                const response = await fetch(`docs/${currentProject}/${filename}`);
                if (!response.ok) {
                    throw new Error(`Failed to load ${filename}`);
                }
                
                const markdown = await response.text();
                const html = await renderMarkdown(markdown);
                
                content.innerHTML = html;
                loading.style.display = 'none';
                content.style.display = 'block';
                
                // Render mermaid diagrams
                await renderMermaidDiagrams();
                
                // Add click handlers for internal markdown links
                setupMarkdownLinks();
                
                // Scroll to top
                window.scrollTo(0, 0);
                
            } catch (error) {
                console.error('Error loading document:', error);
                showError(`Failed to load document: ${filename}`);
            }
        }
        
        function setupMarkdownLinks() {
            // Intercept clicks on internal .md links
            const links = document.querySelectorAll('.markdown-content a[href$=".md"]');
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    
                    // Extract just the filename (handle relative paths)
                    const filename = href.split('/').pop();
                    
                    // Load the document
                    loadDocument(filename);
                    
                    // Update active state in sidebar
                    document.querySelectorAll('.nav-item').forEach(item => {
                        if (item.getAttribute('data-file') === filename) {
                            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                            item.classList.add('active');
                        }
                    });
                });
            });
        }
        
        async function renderMarkdown(markdown) {
            // Convert markdown to HTML using marked
            let html = marked.parse(markdown);
            
            // Process mermaid code blocks
            html = html.replace(
                /<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,
                (match, code) => {
                    const decodedCode = code
                        .replace(/&lt;/g, '<')
                        .replace(/&gt;/g, '>')
                        .replace(/&amp;/g, '&')
                        .replace(/&quot;/g, '"')
                        .replace(/&#39;/g, "'");
                    return `<div class="mermaid">${decodedCode}</div>`;
                }
            );
            
            return html;
        }
        
        async function renderMermaidDiagrams() {
            const mermaidElements = document.querySelectorAll('.mermaid');
            
            for (let i = 0; i < mermaidElements.length; i++) {
                const element = mermaidElements[i];
                const id = `mermaid-${Date.now()}-${i}`;
                element.id = id;
                
                try {
                    const { svg } = await mermaid.render(id + '-svg', element.textContent);
                    element.innerHTML = svg;
                    makeMermaidZoomable(element);
                } catch (error) {
                    console.error('Mermaid rendering error:', error);
                    element.innerHTML = `<pre>Error rendering diagram:\n${element.textContent}</pre>`;
                }
            }
        }

        // ---------- Mermaid full-screen lightbox with pan & zoom ----------

        let lightboxEl = null;
        const lightboxState = { scale: 1, tx: 0, ty: 0, width: 0, height: 0 };

        function makeMermaidZoomable(element) {
            element.classList.add('zoomable');

            const btn = document.createElement('button');
            btn.className = 'mermaid-expand';
            btn.type = 'button';
            btn.title = 'Expand diagram';
            btn.setAttribute('aria-label', 'Expand diagram');
            btn.textContent = '⛶';
            element.appendChild(btn);

            element.addEventListener('click', function(e) {
                if (e.target.closest('a')) return; // keep links inside diagrams working
                openMermaidLightbox(element);
            });
        }

        function ensureLightbox() {
            if (lightboxEl) return lightboxEl;

            lightboxEl = document.createElement('div');
            lightboxEl.className = 'mermaid-lightbox';
            lightboxEl.setAttribute('role', 'dialog');
            lightboxEl.setAttribute('aria-label', 'Diagram viewer');
            lightboxEl.innerHTML =
                '<div class="lightbox-canvas"><div class="lightbox-stage"></div></div>' +
                '<div class="lightbox-toolbar">' +
                '<button type="button" data-action="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>' +
                '<button type="button" data-action="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>' +
                '<button type="button" data-action="reset" title="Reset view" aria-label="Reset view">Fit</button>' +
                '<button type="button" data-action="close" title="Close (Esc)" aria-label="Close">✕</button>' +
                '</div>' +
                '<div class="lightbox-hint">Scroll to zoom · drag to pan · Esc to close</div>';
            document.body.appendChild(lightboxEl);

            const canvas = lightboxEl.querySelector('.lightbox-canvas');

            lightboxEl.querySelector('.lightbox-toolbar').addEventListener('click', function(e) {
                const button = e.target.closest('button');
                if (!button) return;
                const action = button.getAttribute('data-action');
                const cx = canvas.clientWidth / 2;
                const cy = canvas.clientHeight / 2;
                if (action === 'zoom-in') zoomLightboxAt(cx, cy, 1.4);
                else if (action === 'zoom-out') zoomLightboxAt(cx, cy, 1 / 1.4);
                else if (action === 'reset') fitLightbox();
                else if (action === 'close') closeMermaidLightbox();
            });

            // Wheel zoom centred on the cursor (trackpad pinch arrives as
            // ctrl+wheel and is covered by the same handler)
            canvas.addEventListener('wheel', function(e) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                zoomLightboxAt(e.clientX - rect.left, e.clientY - rect.top, factor);
            }, { passive: false });

            // Drag to pan; two pointers pinch to zoom (touch)
            const pointers = new Map();
            let lastPinchDist = 0;

            canvas.addEventListener('pointerdown', function(e) {
                canvas.setPointerCapture(e.pointerId);
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers.size === 1) canvas.classList.add('dragging');
                if (pointers.size === 2) {
                    const pts = Array.from(pointers.values());
                    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                }
            });

            canvas.addEventListener('pointermove', function(e) {
                if (!pointers.has(e.pointerId)) return;
                const prev = pointers.get(e.pointerId);
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (pointers.size === 1) {
                    lightboxState.tx += e.clientX - prev.x;
                    lightboxState.ty += e.clientY - prev.y;
                    applyLightboxTransform();
                } else if (pointers.size === 2) {
                    const pts = Array.from(pointers.values());
                    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    if (lastPinchDist > 0) {
                        const rect = canvas.getBoundingClientRect();
                        const midX = (pts[0].x + pts[1].x) / 2 - rect.left;
                        const midY = (pts[0].y + pts[1].y) / 2 - rect.top;
                        zoomLightboxAt(midX, midY, dist / lastPinchDist);
                    }
                    lastPinchDist = dist;
                }
            });

            function releasePointer(e) {
                pointers.delete(e.pointerId);
                lastPinchDist = 0;
                if (pointers.size === 0) canvas.classList.remove('dragging');
            }
            canvas.addEventListener('pointerup', releasePointer);
            canvas.addEventListener('pointercancel', releasePointer);

            // Double-click to zoom in on a spot
            canvas.addEventListener('dblclick', function(e) {
                const rect = canvas.getBoundingClientRect();
                zoomLightboxAt(e.clientX - rect.left, e.clientY - rect.top, 2);
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightboxEl.classList.contains('open')) {
                    closeMermaidLightbox();
                }
            });

            return lightboxEl;
        }

        function openMermaidLightbox(element) {
            const svg = element.querySelector('svg');
            if (!svg) return;

            const lb = ensureLightbox();
            const stage = lb.querySelector('.lightbox-stage');
            stage.innerHTML = '';

            const clone = svg.cloneNode(true);
            let width = 800;
            let height = 600;
            const vb = clone.viewBox && clone.viewBox.baseVal;
            if (vb && vb.width && vb.height) {
                width = vb.width;
                height = vb.height;
            }
            // Give the clone its natural size; scaling happens via transform
            clone.style.maxWidth = 'none';
            clone.style.width = width + 'px';
            clone.style.height = height + 'px';
            clone.setAttribute('width', width);
            clone.setAttribute('height', height);
            stage.style.width = width + 'px';
            stage.style.height = height + 'px';
            stage.appendChild(clone);

            lightboxState.width = width;
            lightboxState.height = height;

            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
            fitLightbox();
        }

        function fitLightbox() {
            const canvas = lightboxEl.querySelector('.lightbox-canvas');
            const cw = canvas.clientWidth;
            const ch = canvas.clientHeight;
            // Fill most of the screen — small diagrams get scaled UP
            const fit = Math.min(cw * 0.9 / lightboxState.width, ch * 0.85 / lightboxState.height);
            lightboxState.scale = Math.min(Math.max(fit, 0.1), 10);
            lightboxState.tx = (cw - lightboxState.width * lightboxState.scale) / 2;
            lightboxState.ty = (ch - lightboxState.height * lightboxState.scale) / 2;
            applyLightboxTransform();
        }

        function zoomLightboxAt(x, y, factor) {
            const newScale = Math.min(Math.max(lightboxState.scale * factor, 0.1), 12);
            const applied = newScale / lightboxState.scale;
            lightboxState.tx = x - (x - lightboxState.tx) * applied;
            lightboxState.ty = y - (y - lightboxState.ty) * applied;
            lightboxState.scale = newScale;
            applyLightboxTransform();
        }

        function applyLightboxTransform() {
            const stage = lightboxEl.querySelector('.lightbox-stage');
            stage.style.transform = 'translate(' + lightboxState.tx + 'px, ' + lightboxState.ty + 'px) scale(' + lightboxState.scale + ')';
        }

        function closeMermaidLightbox() {
            if (!lightboxEl) return;
            lightboxEl.classList.remove('open');
            lightboxEl.querySelector('.lightbox-stage').innerHTML = '';
            document.body.style.overflow = '';
        }

        function showError(message) {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            
            loading.style.display = 'none';
            content.style.display = 'block';
            content.innerHTML = `
                <div class="error">
                    <h3>⚠️ Error</h3>
                    <p>${message}</p>
                    <p style="margin-top: 1rem;">
                        <a href="index.html" style="color: #991b1b; text-decoration: underline;">
                            Return to gallery
                        </a>
                    </p>
                </div>
            `;
        }
    </script>
</body>
